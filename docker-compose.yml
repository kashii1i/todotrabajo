services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todotrabajo
      POSTGRES_USER: todotrabajo
      POSTGRES_PASSWORD: todotrabajo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todotrabajo -d todotrabajo"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
